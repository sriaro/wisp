[package]
name = "wisp"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"

[[bin]]
name = "Wisp"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030", "software-renderer-path", "compat-1-18", "unstable-fontique-011", "image-default-formats"] }
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_Restore"] }

png = "0.18"
blake3 = "1.8.7"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[patch.crates-io]
femtovg = { path = "third_party/femtovg" }
i-slint-renderer-femtovg = { path = "third_party/i-slint-renderer-femtovg" }
